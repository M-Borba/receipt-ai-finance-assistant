name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  web:
    name: Web a Firebase Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze lib test --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release

      - name: Deploy a Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mborba-proyect
          channelId: live

  android:
    name: APK para instalacion directa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # Firma con la clave de debug (android/app/build.gradle.kts:35).
      # Sirve para instalar a mano, NO para publicar en Play.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: receiptai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
