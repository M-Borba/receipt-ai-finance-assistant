name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  web:
    name: Web a Firebase Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze lib test --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release

      - name: Deploy a Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mborba-proyect
          channelId: live

# El job del APK se saco el 2026-09-05. Solo se usa la web, y un job que falla
# siempre entrena a ignorar el CI: cuando TODO esta en rojo, un rojo nuevo no
# dice nada. Con esto, un rojo vuelve a significar que algo se rompio.
#
# La configuracion de Android quedo arreglada (paquete unificado en
# com.mborba.financialassistant y google-services.json versionado), asi que
# `flutter build apk --release` deberia andar en una maquina con el SDK. Para
# volver a tenerlo en CI, recuperar este job con:
#     git show 68215bc:.github/workflows/deploy.yml
